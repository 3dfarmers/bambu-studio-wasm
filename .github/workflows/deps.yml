name: Dependencies

# Builds the WebAssembly libraries the slicer links against and keeps them as a
# cache (for the engine build) and as an artifact (for local builds).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-deps.sh
      - patches/onetbb/**
      - .github/workflows/deps.yml

env:
  EMSDK_VERSION: "3.1.74"
  EMSDK: /opt/emsdk

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        id: emsdk
        uses: actions/cache@v4
        with:
          path: /opt/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/prepare-emscripten-eh.py') }}-v1

      - name: Install Emscripten
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install "$EMSDK_VERSION"
          /opt/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build python3 cmake m4 texinfo clang

      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: deps-install
          key: deps-v1-${{ hashFiles('scripts/build-deps.sh', 'patches/onetbb/**') }}
          restore-keys: deps-v1-

      - name: Build dependencies
        run: bash scripts/build-deps.sh

      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps-install
          key: deps-v1-${{ hashFiles('scripts/build-deps.sh', 'patches/onetbb/**') }}

      - name: Pack dependencies
        run: tar czf deps-install.tar.gz deps-install && ls -lh deps-install.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: deps-install
          path: deps-install.tar.gz
          retention-days: 30
